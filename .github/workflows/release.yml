name: Release

# Two ways in:
#   1. Push a tag (v1.2.3)            -> build and publish that version.
#   2. Bump <VersionPrefix> in RatingSync.csproj on main
#      (or run this workflow manually) -> publish the version in the csproj,
#      creating the tag automatically, but only if it was not released yet.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prefix: ${{ steps.ver.outputs.prefix }}
      suffix: ${{ steps.ver.outputs.suffix }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          } else {
            [xml]$csproj = Get-Content "RatingSync.csproj"
            $prefix = @($csproj.Project.PropertyGroup.VersionPrefix | Where-Object { $_ })[0]
            $suffix = @($csproj.Project.PropertyGroup.VersionSuffix | Where-Object { $_ })[0]
            if ([string]::IsNullOrWhiteSpace($prefix)) { throw "No <VersionPrefix> in RatingSync.csproj" }
            $version = if ([string]::IsNullOrWhiteSpace($suffix)) { $prefix } else { "$prefix-$suffix" }
            $tag = "v$version"
          }

          # Split SemVer into prefix and optional prerelease suffix.
          # Example: 0.1.0-beta.1 => prefix=0.1.0, suffix=beta.1
          $prefixOut = $version
          $suffixOut = ""
          if ($version -match '^(?<p>[^-]+)-(?<s>.+)$') {
            $prefixOut = $Matches['p']
            $suffixOut = $Matches['s']
          }

          # Release only what is missing, so plain pushes are cheap no-ops.
          # `gh release view` exits 1 when the release does not exist; that is
          # the expected "go ahead" signal, so clear the exit code afterwards.
          # (The pwsh wrapper GitHub uses ends with `exit $LASTEXITCODE`.)
          $publish = "true"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to do."
            $publish = "false"
          } else {
            Write-Host "Release $tag does not exist yet; it will be built."
          }
          $LASTEXITCODE = 0

          "version=$version" >> $env:GITHUB_OUTPUT
          "prefix=$prefixOut" >> $env:GITHUB_OUTPUT
          "suffix=$suffixOut" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          $LASTEXITCODE = 0

  build-and-release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build -c Release --no-restore -p:VersionPrefix="${{ needs.check.outputs.prefix }}" -p:VersionSuffix="${{ needs.check.outputs.suffix }}"

      - name: Regression checks
        shell: pwsh
        run: |
          dotnet build tests/RatingSync.Tests.csproj -c Release
          & ./tests/bin/Release/net462/RatingSync.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check Configuration/configPage.js

      - name: Package
        shell: pwsh
        run: |
          $outDir = Join-Path $PWD "bin\Release"
          $dll = Join-Path $outDir "RatingSync.dll"
          if (!(Test-Path $dll)) { throw "Missing build output: $dll" }
          $zip = Join-Path $PWD ("RatingSync-" + "${{ needs.check.outputs.tag }}" + ".zip")
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $dll -DestinationPath $zip

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ needs.check.outputs.version }}"
          $isPrerelease = $version.Contains('-')

          # Release body = only the bullet list under ## [version] in CHANGELOG.md (no boilerplate).
          $changesBlock = ""
          $changelogPath = Join-Path $PWD "CHANGELOG.md"
          if (Test-Path $changelogPath) {
            $lines = Get-Content $changelogPath
            $escaped = [regex]::Escape($version)
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+\[$escaped\]") { $start = $i; break }
            }

            if ($start -ge 0) {
              $body = New-Object System.Collections.Generic.List[string]
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match '^##\s+\[') { break }
                $body.Add($lines[$j])
              }
              $trimmed = $body | Where-Object { $_ -and $_.Trim() -ne '' }
              if ($trimmed.Count -gt 0) {
                $changesBlock = ($trimmed -join "`n").TrimEnd()
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($changesBlock)) {
            $changesBlock = "- No CHANGELOG section found for this version; see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          }

          if ($isPrerelease) {
            $changesBlock = "_Prerelease — behavior may change._`n`n" + $changesBlock
          }

          $changesBlock | Out-File -FilePath "release-notes.md" -Encoding utf8NoBOM

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rating Sync ${{ needs.check.outputs.tag }}
          tag_name: ${{ needs.check.outputs.tag }}
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          body_path: release-notes.md
          files: |
            bin/Release/RatingSync.dll
            RatingSync-${{ needs.check.outputs.tag }}.zip
