name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Regression checks
        run: |
          dotnet build tests/RatingSync.Tests.csproj -c Release
          & ./tests/bin/Release/net462/RatingSync.Tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check Configuration/configPage.js
